<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>마린스키극장에서</title>
<style>
  :root{
    --bg:#f2f2f7;
    --header:rgba(248,248,250,.94);
    --line:#d1d1d6;
    --text:#111;
    --muted:#8e8e93;
    --incoming:#e5e5ea;
    --outgoing:#fff;
    --blue:#007aff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text)}
  body{background:#111;display:flex;justify-content:center;align-items:center;overflow:hidden}
  .phone{
    width:min(100vw,430px);
    height:min(100dvh,900px);
    background:var(--bg);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:600px){
    .phone{
      height:min(900px,calc(100vh - 28px));
      border-radius:32px;
      box-shadow:0 18px 60px rgba(0,0,0,.4);
      border:1px solid #333;
    }
  }
  .statusbar{
    height:28px;flex:0 0 28px;background:var(--header);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;font-size:12px;font-weight:600;
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .status-right{display:flex;gap:7px;align-items:center}
  .signal{letter-spacing:-2px}.battery{border:1.5px solid #222;border-radius:3px;padding:0 2px;font-size:9px}
  .chat-header{
    height:64px;flex:0 0 64px;background:var(--header);
    border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:42px 1fr 42px;align-items:center;
    padding:0 8px;backdrop-filter:blur(16px);
  }
  .icon-btn{border:0;background:none;font-size:26px;line-height:1;color:var(--blue);cursor:pointer;padding:8px}
  .profile-wrap{text-align:center;min-width:0}
  .avatar{
    width:30px;height:30px;margin:0 auto 2px;border-radius:50%;
    background:linear-gradient(145deg,#222,#777);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;font-weight:700;
  }
  .name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:9px;color:var(--muted);margin-top:1px}
  .messages{
    flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:14px 12px 14px;scroll-behavior:smooth;
  }
  .day{font-size:11px;color:var(--muted);text-align:center;margin:2px 0 12px}
  .message-row{display:flex;flex-direction:column;margin:7px 0;animation:rise .28s ease-out both}
  .message-row.incoming{align-items:flex-start}
  .message-row.outgoing{align-items:flex-end}
  .bubble{
    max-width:78%;padding:9px 13px;border-radius:18px;
    font-size:16px;line-height:1.42;word-break:keep-all;white-space:pre-wrap;
  }
  .incoming .bubble{background:var(--incoming);border-bottom-left-radius:6px}
  .outgoing .bubble{background:var(--outgoing);border:1px solid #dedee2;border-bottom-right-radius:6px}
  .meta{font-size:10px;color:var(--muted);margin:3px 5px 0}
  .sender{font-size:11px;color:#666;margin:0 0 4px 5px}
  .error{
    align-self:flex-end;color:#ff3b30;font-size:11px;margin:2px 6px 0;
    animation:rise .2s ease-out both;
  }
  .composer{
    flex:0 0 auto;background:rgba(248,248,250,.96);
    border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;gap:7px;align-items:flex-end;
  }
  .input{
    flex:1;min-width:0;min-height:38px;max-height:100px;resize:none;
    border:1px solid #c7c7cc;border-radius:19px;background:#fff;
    padding:8px 13px;font:16px/1.35 inherit;outline:none;
  }
  .input:focus{border-color:#aaa}
  .send{
    width:38px;height:38px;border:0;border-radius:50%;background:var(--blue);color:white;
    font-size:18px;cursor:pointer;display:grid;place-items:center;
  }
  .send:active{transform:scale(.96)}
  .notice{
    font-size:9px;color:#8e8e93;text-align:center;padding:0 10px 5px;
    background:rgba(248,248,250,.96);
  }
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .message-row,.error{animation:none}
    .messages{scroll-behavior:auto}
  }
</style>
</head>
<body>
<main class="phone" aria-label="마린스키극장에서 문자메시지">
  <div class="statusbar">
    <span id="clock">05:40</span>
    <span class="status-right"><span class="signal">▮▮▮</span><span>Wi‑Fi</span><span class="battery">100</span></span>
  </div>

  <header class="chat-header">
    <button class="icon-btn" aria-label="뒤로가기">‹</button>
    <div class="profile-wrap">
      <div class="avatar" aria-hidden="true">М</div>
      <div class="name">Моя самая сладкая смерть</div>
      <div class="status">메시지</div>
    </div>
    <button class="icon-btn" aria-label="정보">ⓘ</button>
  </header>

  <section class="messages" id="messages" aria-live="polite">
    <div class="day">오후 05:40</div>
  </section>

  <div class="notice">실제 문자 발송 및 서버 저장은 이루어지지 않습니다.</div>
  <form class="composer" id="composer">
    <textarea id="input" class="input" rows="1" placeholder="메시지" aria-label="메시지 입력"></textarea>
    <button class="send" type="submit" aria-label="전송">↑</button>
  </form>
</main>

<script>
"use strict";

const messages = [
  { time:"오후 05:42", text:"결혼식이 내일이라고 들었어요." },
  { time:"오후 05:42", text:"초대장도 받았고요." },
  { time:"오후 05:43", text:"저는 소좌님 아직 좋아하는데." },
  { time:"오후 05:44", text:"우리 그때로 돌아갈 순 없는 걸까요?" },
  { time:"오후 05:45", text:"저는 소좌님에게 행복하냐고 묻고 싶었어요." },
  { time:"오후 05:52", text:"상트페트르부르크 마린스키 극장에서 기다릴게요." },
  { time:"오후 05:59", text:"늦지 않고 잘 찾아와요." }
];

const DELAY = 3000;
const messagesEl = document.getElementById("messages");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const clock = document.getElementById("clock");

function scrollToBottom(){
  messagesEl.scrollTo({top:messagesEl.scrollHeight, behavior:"smooth"});
}

function addIncoming(message, index){
  const row = document.createElement("div");
  row.className = "message-row incoming";

  if(index === 0){
    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = "Моя самая сладкая смерть";
    row.appendChild(sender);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = message.text;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = message.time;

  row.append(bubble, meta);
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addFailedOutgoing(text){
  const row = document.createElement("div");
  row.className = "message-row outgoing";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const error = document.createElement("div");
  error.className = "error";
  error.textContent = "메시지를 전송할 수 없습니다.";

  row.append(bubble, error);
  messagesEl.appendChild(row);
  scrollToBottom();
}

async function playMessages(){
  // 첫 메시지는 사이트 접속 직후 표시
  addIncoming(messages[0], 0);

  // 이후 메시지는 정확히 3초 간격
  for(let i = 1; i < messages.length; i++){
    await new Promise(resolve => setTimeout(resolve, DELAY));
    addIncoming(messages[i], i);
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  addFailedOutgoing(text);
  input.value = "";
  input.style.height = "auto";
  input.focus();
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 100) + "px";
});

input.addEventListener("keydown", event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    form.requestSubmit();
  }
});

// 상태 표시줄 시간은 장식용으로 05:40에서 시작한다.
clock.textContent = "05:40";

playMessages();
</script>
</body>
</html>
